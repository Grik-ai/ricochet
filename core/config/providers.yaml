providers:
  grik:
    enabled: true
    key: "${GRIKAI_ACCESS_TOKEN}"
    base_url: "${GRIKAI_CODE_GATEWAY_URL}"
    models:
      - id: "ricochet-code"
        name: "Grik Ricochet Code"
        context_window: 200000
        supports_tools: true

  deepseek:
    enabled: true
    key: "${DEEPSEEK_API_KEY}"
    base_url: "https://api.deepseek.com/v1"
    models:
      - id: "deepseek-chat"
        name: "DeepSeek V3.2"
        context_window: 128000
        input_price: 0.27
        output_price: 1.10
        supports_tools: true
      - id: "deepseek-reasoner"
