# Public provider catalog.
#
# This file is safe to publish. It contains provider/model metadata and
# environment-variable placeholders only. Do not put real API keys, bearer
# tokens, OAuth secrets, bot tokens, billing data, or private Grik gateway
# credentials here.
#
# Grik hosted subscription credentials, limits, and billing enforcement live in
# Grik services. BYOK providers resolve placeholders such as
# ${OPENROUTER_API_KEY} from the user's local environment or secret storage.

