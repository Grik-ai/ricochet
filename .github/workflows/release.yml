name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  NODE_VERSION: "24"
  EXTENSION_ID: grik.ricochet
  GITHUB_RELEASE_REPO: Grik-ai/ricochet
  HOMEBREW_TAP_REPO: grik-ai/homebrew-tap

jobs:
  validate:
    name: Validate Release Inputs
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    env:
      HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
      HAS_HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Resolve Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if [[ "${TAG}" == "${VERSION}" ]]; then
            echo "::error::Release tags must start with v, for example v0.2.0."
            exit 1
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag ${TAG} is not a SemVer tag like v0.2.0."
            exit 1
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Report Optional Publish Channels
        shell: bash
        run: |
          set -euo pipefail
          echo "OVSX_PAT configured: ${HAS_OVSX_PAT}"
          echo "VSCE_PAT configured: ${HAS_VSCE_PAT}"
          echo "NPM_TOKEN configured: ${HAS_NPM_TOKEN}"
          echo "HOMEBREW_TAP_TOKEN configured: ${HAS_HOMEBREW_TAP_TOKEN}"

          if [[ "${HAS_VSCE_PAT}" != "true" ]]; then
            echo "::warning::Missing VSCE_PAT. The GitHub Release will still be created, but VS Code Marketplace publish will be skipped."
          fi

          if [[ "${HAS_OVSX_PAT}" != "true" ]]; then
            echo "::warning::Missing OVSX_PAT. The GitHub Release will still be created, but Open VSX publish will be skipped."
          fi

          if [[ "${HAS_NPM_TOKEN}" != "true" ]]; then
            echo "::warning::Missing NPM_TOKEN. The GitHub Release will still be created, but npm publish will be skipped."
          fi

          if [[ "${HAS_HOMEBREW_TAP_TOKEN}" != "true" ]]; then
            echo "::warning::Missing HOMEBREW_TAP_TOKEN. The GitHub Release will still be created, but Homebrew tap PR will be skipped."
          fi

  test:
    name: Test Release Build
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test Core
        shell: bash
        run: |
          set -euo pipefail
          cd core
          go test ./...

      - name: Test Webview
        shell: bash
        run: |
          set -euo pipefail
          cd webview
          npm ci
          npm run build
          npm test -- --run

      - name: Test Extension
        shell: bash
        run: |
          set -euo pipefail
          cd extension-vscode
          npm ci
          npm run build
          npm test -- --run

      - name: Test Installer
        shell: bash
        run: |
          set -euo pipefail
          cd installer
          npm test

  build-core:
    name: Build Core (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
            goos: linux
            goarch: amd64
            ext: ""
          - runner: windows-latest
            target: win32-x64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - runner: macos-15-intel
            target: darwin-x64
            goos: darwin
            goarch: amd64
            ext: ""
          - runner: macos-15
            target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Add Windows C Toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -Append $env:GITHUB_PATH

      - name: Build Binary
        shell: bash
        run: |
          set -euo pipefail
          cd core

          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="${GITHUB_SHA::12}"
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          LDFLAGS="-s -w -X github.com/igoryan-dao/ricochet/internal/version.Version=${VERSION} -X github.com/igoryan-dao/ricochet/internal/version.Commit=${COMMIT} -X github.com/igoryan-dao/ricochet/internal/version.BuildTime=${BUILD_TIME}"

          mkdir -p "../extension-vscode/bin/${{ matrix.target }}"
          CGO_ENABLED=1 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" go build \
            -ldflags="${LDFLAGS}" \
            -o "../extension-vscode/bin/${{ matrix.target }}/ricochet-core${{ matrix.ext }}" \
            ./cmd/ricochet

          if [[ "${{ matrix.ext }}" != ".exe" ]]; then
            chmod +x "../extension-vscode/bin/${{ matrix.target }}/ricochet-core"
          fi

      - name: Upload Core Artifact
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.target }}
          path: extension-vscode/bin/${{ matrix.target }}
          if-no-files-found: error

  package-and-release:
    name: Package, Publish, and Release
    needs:
      - validate
      - build-core
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TAG: ${{ needs.validate.outputs.tag }}
      HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
      HAS_HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install Webview Dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd webview
          npm ci

      - name: Build Webview
        shell: bash
        run: |
          set -euo pipefail
          cd webview
          npm run build

      - name: Install Extension Dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd extension-vscode
          npm ci

      - name: Download Core Binaries
        uses: actions/download-artifact@v4
        with:
          pattern: core-*
          path: extension-vscode/bin

      - name: Organize Binaries
        shell: bash
        run: |
          set -euo pipefail
          cd extension-vscode/bin

          mkdir -p linux-x64 win32-x64 darwin-x64 darwin-arm64
          mv core-linux-x64/* linux-x64/
          mv core-win32-x64/* win32-x64/
          mv core-darwin-x64/* darwin-x64/
          mv core-darwin-arm64/* darwin-arm64/
          rm -rf core-*
          chmod +x linux-x64/ricochet-core darwin-x64/ricochet-core darwin-arm64/ricochet-core

          test -x linux-x64/ricochet-core
          test -f win32-x64/ricochet-core.exe
          test -x darwin-x64/ricochet-core
          test -x darwin-arm64/ricochet-core

      - name: Prepare Package Assets
        shell: bash
        run: |
          set -euo pipefail
          cp README.md extension-vscode/
          cp LICENSE extension-vscode/
          cp GOVERNANCE.md extension-vscode/ || true
          test -f extension-vscode/assets/ricochet.png

      - name: Set Package Versions
        shell: bash
        run: |
          set -euo pipefail
          cd extension-vscode
          npm version "${VERSION}" --no-git-tag-version --allow-same-version

          cd ../installer
          npm version "${VERSION}" --no-git-tag-version --allow-same-version

      - name: Package VSIX
        shell: bash
        run: |
          set -euo pipefail
          cd extension-vscode
          npm run check:package-secrets
          npm run build
          npx @vscode/vsce package --no-dependencies --out "ricochet-${VERSION}.vsix"

      - name: Create Release Manifest
        shell: bash
        run: |
          set -euo pipefail
          cd extension-vscode

          VSIX="ricochet-${VERSION}.vsix"
          SHA256="$(sha256sum "${VSIX}" | awk '{print $1}')"

          {
            printf '{\n'
            printf '  "version": "%s",\n' "${VERSION}"
            printf '  "marketplace_id": "%s",\n' "${EXTENSION_ID}"
            printf '  "vsix_url": "https://github.com/%s/releases/download/%s/%s",\n' "${GITHUB_REPOSITORY}" "${TAG}" "${VSIX}"
            printf '  "sha256": "%s",\n' "${SHA256}"
            printf '  "supported_editors": ["code", "cursor", "windsurf"]\n'
            printf '}\n'
          } > latest.json

          cp ../installer/install.sh install.sh
          sha256sum "${VSIX}" latest.json install.sh > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            extension-vscode/ricochet-*.vsix
            extension-vscode/latest.json
            extension-vscode/SHA256SUMS
            extension-vscode/install.sh
          generate_release_notes: true

      - name: Publish VS Code Marketplace
        if: env.HAS_VSCE_PAT == 'true'
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          cd extension-vscode
          npx @vscode/vsce publish --packagePath "ricochet-${VERSION}.vsix" -p "${VSCE_PAT}"

      - name: Skip VS Code Marketplace Publish
        if: env.HAS_VSCE_PAT != 'true'
        shell: bash
        run: |
          echo "::warning::VSCE_PAT is not configured; skipping VS Code Marketplace publish."

      - name: Publish Open VSX
        if: env.HAS_OVSX_PAT == 'true'
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          cd extension-vscode
          npx ovsx publish "ricochet-${VERSION}.vsix" -p "${OVSX_PAT}"

      - name: Skip Open VSX Publish
        if: env.HAS_OVSX_PAT != 'true'
        shell: bash
        run: |
          echo "::warning::OVSX_PAT is not configured; skipping Open VSX publish."

      - name: Publish NPM Installer
        if: env.HAS_NPM_TOKEN == 'true'
        continue-on-error: true
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd installer
          npm publish --access public

      - name: Skip NPM Publish
        if: env.HAS_NPM_TOKEN != 'true'
        shell: bash
        run: |
          echo "::warning::NPM_TOKEN is not configured; skipping npm publish."

      - name: Update Homebrew Tap
        if: env.HAS_HOMEBREW_TAP_TOKEN == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          TAP_DIR="$(mktemp -d)"
          BRANCH="ricochet-${TAG}"

          git clone "https://github.com/${HOMEBREW_TAP_REPO}.git" "${TAP_DIR}"
          mkdir -p "${TAP_DIR}/Formula"
          cp packaging/homebrew/Formula/ricochet.rb "${TAP_DIR}/Formula/ricochet.rb"

          cd "${TAP_DIR}"
          perl -0pi -e "s/tag: \"v[^\"]+\"/tag: \"${TAG}\"/" Formula/ricochet.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add Formula/ricochet.rb

          if git diff --cached --quiet; then
            echo "Homebrew tap is already updated for ${TAG}."
            exit 0
          fi

          git commit -m "Update ricochet to ${TAG}"
          git remote set-url origin "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git"
          git push --force-with-lease origin "HEAD:${BRANCH}"

          if ! gh pr create \
            --repo "${HOMEBREW_TAP_REPO}" \
            --head "${BRANCH}" \
            --base main \
            --title "Update ricochet to ${TAG}" \
            --body "Automated Ricochet release update for ${TAG}."; then
            EXISTING_PR="$(gh pr list --repo "${HOMEBREW_TAP_REPO}" --head "${BRANCH}" --json url --jq '.[0].url // empty')"
            if [[ -z "${EXISTING_PR}" ]]; then
              echo "::error::Failed to create Homebrew tap PR and no existing PR was found for ${BRANCH}."
              exit 1
            fi
            echo "Homebrew tap PR already exists: ${EXISTING_PR}"
          fi

      - name: Skip Homebrew Tap Update
        if: env.HAS_HOMEBREW_TAP_TOKEN != 'true'
        shell: bash
        run: |
          echo "::warning::HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap update."
