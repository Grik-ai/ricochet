trigger:
  tags:
    include:
      - v*

pr: none

variables:
  NODE_VERSION: "24.x"
  VSCE_AZURE_SERVICE_CONNECTION: "Ricochet Marketplace Publisher"

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: none

  - task: NodeTool@0
    displayName: "Setup Node.js"
    inputs:
      versionSpec: "$(NODE_VERSION)"

  - bash: |
      set -euo pipefail

      TAG="${BUILD_SOURCEBRANCHNAME}"
      VERSION="${TAG#v}"
      VSIX="ricochet-${VERSION}.vsix"
      URL="https://github.com/Grik-ai/ricochet/releases/download/${TAG}/${VSIX}"

      echo "Waiting for ${URL}"
      for attempt in $(seq 1 60); do
        if curl -fsSLo "${VSIX}" "${URL}"; then
          break
        fi

        if [[ "${attempt}" == "60" ]]; then
          echo "Failed to download ${URL}" >&2
          exit 1
        fi

        sleep 20
      done

      test -s "${VSIX}"
      echo "##vso[task.setvariable variable=VSIX_PATH]${PWD}/${VSIX}"
    displayName: "Download GitHub Release VSIX"

  - bash: |
      set -euo pipefail
      npm install -g @vscode/vsce@latest
      vsce --version
    displayName: "Install vsce"

  - task: AzureCLI@2
    displayName: "Publish VS Code Marketplace extension"
    inputs:
      azureSubscription: "$(VSCE_AZURE_SERVICE_CONNECTION)"
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        VSIX_PATH="$(VSIX_PATH)"
        vsce publish --packagePath "${VSIX_PATH}" --azure-credential
